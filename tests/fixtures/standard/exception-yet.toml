# The roster of touchpoints (contracts/touchpoint-check.md section 1).
#
# This file never states a level. Each touchpoint declares the tag it renders in its own file, at
# the place `declared_at` names, and the check reads it there (research R3). A touchpoint that is
# behind writes a Lag beside that declaration, not here.
#
# What changes here: a touchpoint added, a mechanism changed, a declaration moved, an exception
# recorded. A bump touches nothing in this file.

# 1. The ownership line every web touchpoint carries, naming the organisation (FR-020).

ownership = "An idfkit project."

# 2. The family links, in the order every web touchpoint renders them (research R10, FR-019). The
# sign-in host carries the links and is not among them.

[[family_link]]
order = 1
label = "idfkit"
href = "https://idfkit.com"

[[family_link]]
order = 2
label = "Developers"
href = "https://developers.idfkit.com"

[[family_link]]
order = 3
label = "EnergyPlus docs"
href = "https://docs.idfkit.com"

[[family_link]]
order = 4
label = "Envelop"
href = "https://app.idfkit.com"

[[family_link]]
order = 5
label = "MCP"
href = "https://mcp.idfkit.com"

[[family_link]]
order = 6
label = "Shoebox"
href = "https://shoebox.idfkit.com"

[[family_link]]
order = 7
label = "GitHub"
href = "https://github.com/idfkit"

# 3. Hosts. `vendored` paths are compared byte for byte against the tag's dist (assertion 3);
# `identity_bearing` globs are scanned for stray literals (assertion 4). `notes` is what the
# identity-adopt skill reads before copying.

[[touchpoint]]
id = "idfkit-com"
kind = "host"
repository = "idfkit/idfkit.com"
host = "https://idfkit.com"
property_name = ""
mechanisms = ["css", "hero"]
declared_at = { path = "brand/identity.json", locator = "/level", form = "json-pointer" }
vendored = ["brand/css/", "brand/hero/", "brand/hosts/", "brand/brand-page/"]
identity_bearing = ["css/**/*.css", "js/**/*.js", "index.html", "docs/**/*.html"]
notes = "The site serves brand/hosts/idfkit.com/ at /brand/hosts/idfkit.com/, so head.html's paths are rewritten to that prefix at adoption. brand/brand-page/index.html is also copied to brand/index.html so that /brand/ resolves; adoption keeps the two identical."

[[touchpoint]]
id = "developers"
kind = "host"
repository = "idfkit/idfkit-developers"
host = "https://developers.idfkit.com"
property_name = "Developers"
mechanisms = ["material"]
declared_at = { path = "pyproject.toml", locator = "tool.idfkit.identity.level", form = "toml-key" }
vendored = ["docs/identity/"]
identity_bearing = ["docs/stylesheets/**/*.css", "docs/overrides/**/*.html", "mkdocs.yml"]
notes = "The material derivation and hosts/developers.idfkit.com/ are placed under docs/identity/ so that the site stays buildable from docs/ and mkdocs.yml alone (constitution, Documentation Architecture). The footer partial keeps the pinned-levels line beneath the ownership line."

[[touchpoint]]
id = "mcp"
kind = "host"
repository = "idfkit/idfkit-mcp"
host = "https://mcp.idfkit.com"
property_name = "MCP"
mechanisms = ["material"]
declared_at = { path = "pyproject.toml", locator = "tool.idfkit.identity.level", form = "toml-key" }
vendored = ["docs/identity/"]
identity_bearing = ["docs/stylesheets/**/*.css", "docs/overrides/**/*.html", "mkdocs.yml"]
notes = "Same placement as developers: docs/identity/."

[[touchpoint.exception]]
part = "theme.light"
reason = "Not restyled yet; the deployment's stock API documentation pages at server.idfkit.com/docs and /redoc are served by the gateway framework and carry its own look; no visitor is sent to them, and they are outside this host. Recorded here, under the MCP property, as the one surface of the MCP product the standard does not reach."
since = "identity-2026.1"

[[touchpoint]]
id = "docs"
kind = "host"
repository = "idfkit/idfkit-docs"
host = "https://docs.idfkit.com"
property_name = "EnergyPlus docs"
mechanisms = ["material", "css"]
declared_at = { path = "pyproject.toml", locator = "tool.idfkit.identity.level", form = "toml-key" }
vendored = ["identity/"]
identity_bearing = ["scripts/assets/**/*.css", "scripts/version_manager.py", "zensical.toml"]
notes = "The material derivation serves every per-version site through scripts/convert.py; the css derivation serves the version picker scripts/version_manager.py writes. Both and hosts/docs.idfkit.com/ are placed under identity/ at the repository root."

[[touchpoint]]
id = "app"
kind = "host"
repository = "idfkit/idfkit-app"
host = "https://app.idfkit.com"
property_name = "Envelop"
mechanisms = ["envelop"]
declared_at = { path = "package.json", locator = "/idfkit/identity", form = "json-pointer" }
vendored = ["src/identity/"]
identity_bearing = ["src/**/*.css", "index.html"]
notes = "The envelop derivation and hosts/app.idfkit.com/ are placed under src/identity/. The application's own rule against literals, scripts/design-rules/values.mjs, excludes src/identity/ and nothing else. The favicon set is copied from src/identity/hosts/app.idfkit.com/ into public/."

[[touchpoint]]
id = "auth"
kind = "host"
repository = "idfkit/idfkit-auth"
host = "https://auth.idfkit.com"
property_name = "Sign in"
mechanisms = ["css", "stytch"]
declared_at = { path = "package.json", locator = "/idfkit/identity", form = "json-pointer" }
vendored = ["src/identity/"]
identity_bearing = ["src/styles/**/*.css", "src/**/*.tsx", "index.html"]
notes = "The css and stytch derivations and hosts/auth.idfkit.com/ are placed under src/identity/. The favicon set is copied into public/."

[[touchpoint]]
id = "shoebox"
kind = "host"
repository = "idfkit/idfkit-shoebox"
host = "https://shoebox.idfkit.com"
property_name = "Shoebox"
mechanisms = ["css"]
declared_at = { path = "package.json", locator = "/idfkit/identity", form = "json-pointer" }
vendored = ["identity/"]
identity_bearing = ["index.html", "src/**/*.css"]
notes = "The css derivation and hosts/shoebox.idfkit.com/ are placed under identity/ at the repository root, which Vite serves as static files."

